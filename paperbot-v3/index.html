<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>PaperBot V3 Dashboard</title>
<style>
:root{--bg:#0b1015;--panel:#121a22;--panel2:#17222d;--text:#e7edf3;--muted:#94a5b5;--line:#293746;--green:#57dc96;--red:#ff7b7b;--amber:#ffc861;--blue:#71b7ff;--r:14px}
[data-theme="light"]{--bg:#f4f7fa;--panel:#fff;--panel2:#edf3f7;--text:#17212b;--muted:#5d6e7c;--line:#d7e0e7;--green:#087f43;--red:#bb2525;--amber:#8a5d00;--blue:#076bbb}
*{box-sizing:border-box}body{margin:0 auto;max-width:1320px;padding:20px;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}header{display:flex;align-items:center;gap:16px;margin-bottom:12px}h1{font-size:25px;margin:0}.tag{display:inline-block;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue);font-size:12px;font-weight:700}.sub{color:var(--muted);margin-top:4px}.theme{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer}.status{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:0 0 20px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:var(--amber)}.warning{color:var(--amber);font-weight:650}.error{color:var(--red)}.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.book{min-width:0}.book-head{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}.book-head h2{font-size:21px;margin:0}.book-head span{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.metric{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}.metric .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.65px}.metric .value{font-size:19px;font-weight:700;margin-top:3px;overflow-wrap:anywhere}.metric.wide{grid-column:span 2}.up{color:var(--green)}.down{color:var(--red)}section{margin-top:18px}h3{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--panel2)}td.num,th.num{text-align:right}tr:last-child td{border-bottom:0}.empty{padding:18px;color:var(--muted);text-align:center}.research{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.research .metric .value{font-size:17px}footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(max-width:950px){.books{grid-template-columns:1fr}}@media(max-width:560px){body{padding:12px}h1{font-size:21px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.research{grid-template-columns:repeat(2,1fr)}.metric.wide{grid-column:span 1}.metric .value{font-size:17px}}
</style>
</head>
<body>
<header><div><h1>PaperBot V3 <span class="tag">FORWARD TEST</span></h1><div class="sub">Independent 30m and 4h books · no blended equity</div></div><button class="theme" id="theme" type="button">◐ Theme</button></header>
<div class="status" role="status"><span class="dot" id="dot"></span><span id="status">Loading V3 state…</span><span id="freshness"></span></div>
<main class="books" id="books"></main>
<footer>Portfolio and research ledgers are shown separately for each timeframe. Simulated execution only; no real funds. Values are rendered defensively when state fields are absent.</footer>
<script>
const STATE_URL='../paperbot/state-v3.json';
const TIMEFRAMES=['30m','4h'];
const STARTING_EQUITY=1000;
const el=id=>document.getElementById(id);
const own=(o,k)=>o!=null&&Object.prototype.hasOwnProperty.call(o,k);
const first=(o,keys,fallback=null)=>{for(const k of keys)if(own(o,k)&&o[k]!=null)return o[k];return fallback};
const num=(v,fallback=0)=>{const n=Number(v);return Number.isFinite(n)?n:fallback};
const arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.entries(v).map(([symbol,x])=>({symbol,...(x||{})})):[]);
const count=v=>(typeof v==='number'&&Number.isFinite(v))?v:arr(v).length;
const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(num(v));
const number=v=>v==null?'—':num(v).toLocaleString('en-US');
const pct=v=>v==null?'—':`${num(v)>0?'+':''}${num(v).toFixed(2)}%`;
const escapeHtml=v=>String(v??'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const dateText=v=>{if(!v)return '—';const d=new Date(typeof v==='number'&&v<1e12?v*1000:v);return Number.isNaN(d.getTime())?escapeHtml(v):d.toLocaleString()};
const pnlClass=v=>num(v)>0?'up':num(v)<0?'down':'';
function tradeCosts(t){const explicitFee=num(first(t,['entry_fee'],0))+num(first(t,['exit_fee'],0));const fee=explicitFee||num(first(t,['fee','fees','fee_usd','total_fees'],0));const funding=num(first(t,['funding_pnl','funding','funding_fee','funding_usd'],0));const net=first(t,['net_pnl','pnl_net','netPnl'],null);const gross=first(t,['gross_pnl','pnl_gross'],null);const pnl=first(t,['pnl','realized_pnl'],null);return{fee,funding,gross:gross==null?(pnl==null?null:num(pnl)+fee-funding):num(gross),net:net==null?(pnl==null?null:num(pnl)):num(net)}}
function winRate(trades){if(!trades.length)return null;return trades.filter(t=>num(tradeCosts(t).net)>0).length/trades.length*100}
function total(trades,key){return trades.reduce((sum,t)=>sum+num(tradeCosts(t)[key]),0)}
function metric(label,value,cls='',wide=false){return `<div class="metric${wide?' wide':''}"><div class="label">${label}</div><div class="value mono ${cls}">${value}</div></div>`}
function positionRows(positions){if(!positions.length)return '<tr><td colspan="8" class="empty">No open portfolio positions</td></tr>';return positions.map(p=>{const symbol=first(p,['symbol','sym','coin'],'—');const side=first(p,['side','direction'],first(p,['dir_long'],true)?'LONG':'SHORT');const entry=num(first(p,['entry','entry_price'],0));const last=num(first(p,['last_price','mark','mark_price','price'],0));const notional=num(first(p,['notional'],0));const unrealized=entry&&last?notional*(last/entry-1)-num(first(p,['entry_fee'],0))+num(first(p,['funding_pnl'],0)):null;return `<tr><td class="mono">${escapeHtml(symbol)}</td><td>${escapeHtml(side)}</td><td class="num mono">${money(entry||null)}</td><td class="num mono">${money(last||null)}</td><td class="num mono">${number(entry?notional/entry:null)}</td><td class="num mono ${pnlClass(unrealized)}">${money(unrealized)}</td><td class="num mono">${money(first(p,['entry_fee','fees','fee']))}</td><td>${dateText(first(p,['entry_ms','opened_at','opened','opened_ms']))}</td></tr>`}).join('')}
function tradeRows(trades){if(!trades.length)return '<tr><td colspan="10" class="empty">No closed portfolio trades</td></tr>';return [...trades].reverse().slice(0,50).map(t=>{const c=tradeCosts(t);const entry=num(first(t,['entry','entry_price'],0));const exit=num(first(t,['exit','exit_price'],0));const ret=first(t,['return_pct','ret_pct'],own(t,'ret')?num(t.ret)*100:(entry&&exit?(exit/entry-1)*100:null));const side=first(t,['side','direction'],first(t,['dir_long'],true)?'LONG':'SHORT');return `<tr><td>${dateText(first(t,['exit_ms','closed_at','closed','closed_ms']))}</td><td class="mono">${escapeHtml(first(t,['symbol','sym','coin']))}</td><td>${escapeHtml(side)}</td><td class="num mono">${money(entry||null)}</td><td class="num mono">${money(exit||null)}</td><td class="num mono">${money(c.gross)}</td><td class="num mono down">${money(c.fee)}</td><td class="num mono ${pnlClass(c.funding)}">${money(c.funding)}</td><td class="num mono ${pnlClass(c.net)}">${money(c.net)}</td><td class="num mono ${pnlClass(ret)}">${pct(ret)}</td></tr>`}).join('')}
function renderBook(tf,book={}){const portfolio=book.portfolio||{};const research=book.research||{};const positions=arr(portfolio.positions);const trades=arr(portfolio.trades);const rPositions=arr(research.positions);const rTrades=arr(research.trades);const signals=first(research,['signals'],[]);const rejections=first(research,['rejections'],[]);const equity=first(portfolio,['equity','current_equity'],null);const net=total(trades,'net');const fees=total(trades,'fee');const funding=total(trades,'funding');return `<article class="book" aria-label="${tf} book"><div class="book-head"><h2>${tf}</h2><span>independent book</span></div><h3>Portfolio</h3><div class="metrics">${metric('Equity',money(equity))}${metric('Open',number(positions.length))}${metric('Closed',number(trades.length))}${metric('Win rate',winRate(trades)==null?'—':pct(winRate(trades)))}${metric('Gross PnL',money(total(trades,'gross')),pnlClass(total(trades,'gross')))}${metric('Fee',money(fees),fees?'down':'')}${metric('Funding',money(funding),pnlClass(-funding))}${metric('Net PnL',money(net),pnlClass(net))}</div><section><h3>Research counts</h3><div class="research">${metric('Open',number(rPositions.length))}${metric('Trades',number(rTrades.length))}${metric('Signals',number(count(signals)))}${metric('Rejections',number(count(rejections)))}</div></section><section><h3>Open Positions</h3><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Side</th><th class="num">Entry</th><th class="num">Mark</th><th class="num">Qty</th><th class="num">Unrealized</th><th class="num">Fee</th><th>Opened</th></tr></thead><tbody>${positionRows(positions)}</tbody></table></div></section><section><h3>Trades</h3><div class="table-wrap"><table><thead><tr><th>Closed</th><th>Symbol</th><th>Side</th><th class="num">Entry</th><th class="num">Exit</th><th class="num">Gross PnL</th><th class="num">Fee</th><th class="num">Funding</th><th class="num">Net PnL</th><th class="num">Return</th></tr></thead><tbody>${tradeRows(trades)}</tbody></table></div></section></article>`}
function updateFreshness(state){const stamp=first(state.health||{},['updated_at','generated_at','last_run_at'],state.generated_at);const time=new Date(stamp).getTime();const age=Date.now()-time;const stale=!Number.isFinite(time)||age>15*60*1000;el('freshness').textContent=stale?' · STALE DATA':` · fresh ${Math.max(0,Math.floor(age/60000))}m ago`;el('freshness').className=stale?'warning':'';return stale}
async function load(){try{const response=await fetch(`${STATE_URL}?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const state=await response.json();const books=state.books||{};el('books').innerHTML=TIMEFRAMES.map(tf=>renderBook(tf,books[tf]||{})).join('');const stale=updateFreshness(state);const ok=(state.health||{}).status==='ok';el('dot').style.background=ok&&!stale?'var(--green)':stale?'var(--amber)':'var(--red)';el('status').textContent=`V3 ${escapeHtml(state.version??'—')} · ${ok?'healthy':'degraded'} · generated ${dateText(state.generated_at)}`;el('status').className=ok?'':'error'}catch(error){el('dot').style.background='var(--red)';el('status').textContent=`Unable to load V3 state: ${error.message}`;el('status').className='error';el('freshness').textContent=' · freshness unavailable'}}
el('theme').addEventListener('click',()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark');
load();setInterval(load,30000);
</script>
</body>
</html>
